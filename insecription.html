<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription - FormaPro</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">FormaPro</a>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="index.html#formations">Formations</a></li>
                <li><a href="insecription.html">S'inscrire</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-page">

        <h1>Formulaire d'inscription</h1>
        <p class="form-intro">Remplissez ce formulaire pour rejoindre la formation de votre choix.</p>

        <div class="form-card" id="form-card">

            <form action="" method="post">

                <p class="form-section-title">Informations personnelles</p>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nom">Nom <span class="req">*</span></label>
                        <input type="text" id="nom" name="nom" placeholder="Ex : Farhat" required>
                    </div>
                    <div class="form-group">
                        <label for="prenom">Prénom <span class="req">*</span></label>
                        <input type="text" id="prenom" name="prenom" placeholder="Ex : Hella" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail <span class="req">*</span></label>
                    <input type="email" id="email" name="email" placeholder="Ex : hella.farhat@email.com" required>
                </div>

                <div class="form-group">
                    <label for="telephone">Numéro de téléphone <span class="req">*</span></label>
                    <input type="tel" id="telephone" name="telephone" placeholder="Ex :  12 345 678" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date de naissance</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <p class="form-section-title">Formation souhaitée</p>

                <div class="form-group">
                    <label for="formation">Choisissez une formation <span class="req">*</span></label>
                    <select id="formation" name="formation" required>
                        <option value="" disabled selected>Sélectionner une formation</option>
                        <option value="ia">Intelligence Artificielle</option>
                        <option value="ds">Data Science</option>
                        <option value="cyber">Cybersécurité</option>
                        <option value="cloud">Cloud Computing</option>
                        <option value="web">Développement Web</option>
                        <option value="mobile">Développement Mobile</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Votre niveau actuel <span class="req">*</span></label>
                    <div class="radio-group">
                        <label><input type="radio" name="niveau" value="debutant" required> Débutant</label>
                        <label><input type="radio" name="niveau" value="intermediaire"> Intermédiaire</label>
                        <label><input type="radio" name="niveau" value="avance"> Avancé</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Format préféré</label>
                    <div class="radio-group">
                        <label><input type="radio" name="format" value="presentiel"> Présentiel</label>
                        <label><input type="radio" name="format" value="enligne"> En ligne</label>
                        <label><input type="radio" name="format" value="hybride"> Hybride</label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Envoyer ma candidature</button>

                <a href="index.html" class="form-back">← Retour à l'accueil</a>

            </form>

        </div>

    </div>

    <footer>
        <p>© 2025 FormaPro — Plateforme de Gestion des Formations</p>
    </footer>

</body>
</html>
